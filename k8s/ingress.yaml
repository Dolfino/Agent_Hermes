apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  namespace: hermes
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: hermes.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-app
                port:
                  number: 80
