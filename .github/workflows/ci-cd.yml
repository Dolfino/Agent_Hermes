name: Build, Push and Update GitOps

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ 'k8s/**' ]

env:
  REGISTRY: ghcr.io
  GITHUB_USER: dolfino # INSIRA SEU USUÁRIO DO GITHUB EM LETRAS MINÚSCULAS!
  IMAGE_NAME: hermes-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 🤖 Atualizar Manifesto K8s
        run: |
          sed -i "s|image: ${{ env.REGISTRY }}/${{ env.GITHUB_USER }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.REGISTRY }}/${{ env.GITHUB_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yaml
          
          git config --global user.name "GitOps Bot"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "chore(gitops): nova imagem ${{ github.sha }}"
          git push
